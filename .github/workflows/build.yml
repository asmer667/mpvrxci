name: Build mpvRx APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Standard arm64-v8a Release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Metadata
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleStandardRelease -PtargetAbi=arm64-v8a -PenableX86=false --no-daemon --max-workers=2 --stacktrace

      - name: List APKs
        if: always()
        run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; || true

      - name: Sign APK
        if: success()
        run: |
          set -e
          UNSIGNED=$(find app/build/outputs/apk/standard/release -name "*arm64-v8a*.apk" | head -1)
          [[ -z "$UNSIGNED" ]] && UNSIGNED=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "📦 APK: $UNSIGNED"
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          $APKSIGNER sign --ks debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out final.apk "$UNSIGNED"
          mkdir -p out
          cp final.apk "out/mpvRx-${SHORT_SHA}-arm64-release.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mpvRx-cyber-${{ env.SHORT_SHA }}
          path: out/*.apk
          retention-days: 30
